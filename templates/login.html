<!DOCTYPE html>
<html>
<head>
    <title>Login - AI Career Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-body">

<div class="login-box">
    <h2>🔐 Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="msg"></p>
</div>

<script>
async function login(){
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // FRONTEND VALIDATION
    if(!username){
        document.getElementById("msg").innerText = "⚠️ Username required";
        return;
    }

    let res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: username,
            password: password
        })
    });

    let data = await res.json();

    // 🔴 IMPORTANT CHECK
    if(data.status === "success"){
        localStorage.setItem("career_username", username);
        window.location.href = "/";
    } else {
        document.getElementById("msg").innerText = data.message || "Login failed";
    }
}
</script>

</body>
</html>
